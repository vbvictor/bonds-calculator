name: Тесты и деплой на Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные деплои не нужны, но и обрывать начатый не стоит.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Проверки и сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Версия Node берётся из .nvmrc, чтобы локально и в CI она не разъезжалась.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Тесты идут ДО сборки: разошлась модель с reference/ref.py — деплоя быть не должно.
      - name: Типы
        run: npm run typecheck

      - name: Тесты
        run: npm test

      - name: Сборка
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Публикация
    # На пул-реквестах только проверки, публикуем лишь с main.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
